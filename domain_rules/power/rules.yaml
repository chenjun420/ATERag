# 领域规则: power (定制电源)
#
# `confidence` 表示**出处**可不可信, 不表示公式对不对 —— 后者由每条的
# `test` 块自校(见 scripts/rules_selftest.py)。两者是不同的事。
#
# 分级依据 docs/seed-sources.md: A 可直接采信 / B 可采信需注明出处 /
# C 仅作线索须回 A 级复核 / D 不采信。`source.name` 末尾的方括号是
# 分级标签, 与 confidence 对应。

rules:
- id: K-ELEC-001
  statement: 直流功率 = 电压 × 电流 (P = U × I)
  category: electrical
  scope: dc
  derive:
    output: power
    expr: voltage * current
    inputs:
    - voltage
    - current
  variables:
    voltage: V
    current: A
    power: W
  source:
    name: GB/T 2900.1-2008《电工术语 基本术语》有功功率/功率(直流)
    url: https://openstd.samr.gov.cn/bzgk/std/newGbInfo?hcno=00825B0E95FFA38A3F03F66AB6220693
    retrieved: 2026-10-06
  confidence: 0.95
  test:
    given:
      voltage: 54
      current: 11.1
    expect:
      power: 599.4
- id: K-ELEC-002
  statement: 欧姆定律 电压 = 电流 × 电阻 (U = I × R)
  category: electrical
  scope: dc
  derive:
    output: voltage
    expr: current * resistance
    inputs:
    - current
    - resistance
  variables:
    voltage: V
    current: A
    resistance: Ω
  source:
    name: GB/T 2900.1-2008《电工术语 基本术语》电阻与电压(欧姆定律)
    url: https://openstd.samr.gov.cn/bzgk/std/newGbInfo?hcno=00825B0E95FFA38A3F03F66AB6220693
    retrieved: 2026-10-06
  confidence: 0.95
  test:
    given:
      current: 2
      resistance: 5
    expect:
      voltage: 10
- id: K-ELEC-003
  statement: 欧姆定律 电流 = 电压 / 电阻 (I = U / R)
  category: electrical
  scope: dc
  derive:
    output: current
    expr: voltage / resistance
    inputs:
    - voltage
    - resistance
  source:
    name: GB/T 2900.1-2008《电工术语 基本术语》电阻与电流(欧姆定律)
    url: https://openstd.samr.gov.cn/bzgk/std/newGbInfo?hcno=00825B0E95FFA38A3F03F66AB6220693
    retrieved: 2026-10-06
  confidence: 0.95
  test:
    given:
      voltage: 10
      resistance: 5
    expect:
      current: 2
- id: K-ELEC-004
  statement: 电阻功耗 = 电流² × 电阻 (P = I²R, 焦耳热)
  category: electrical
  scope: dc
  derive:
    output: power
    expr: current * current * resistance
    inputs:
    - current
    - resistance
  source:
    name: GB/T 2900.1-2008《电工术语 基本术语》电阻功耗(焦耳热)
    url: https://openstd.samr.gov.cn/bzgk/std/newGbInfo?hcno=00825B0E95FFA38A3F03F66AB6220693
    retrieved: 2026-10-06
  confidence: 0.95
  test:
    given:
      current: 3
      resistance: 0.03
    expect:
      power: 0.27
- id: K-ELEC-005
  statement: 电阻功耗 = 电压² / 电阻 (P = U²/R, 纯电阻电路)
  category: electrical
  scope: dc
  derive:
    output: power
    expr: voltage * voltage / resistance
    inputs:
    - voltage
    - resistance
  source:
    name: GB/T 2900.1-2008《电工术语 基本术语》电阻功耗(焦耳热)
    url: https://openstd.samr.gov.cn/bzgk/std/newGbInfo?hcno=00825B0E95FFA38A3F03F66AB6220693
    retrieved: 2026-10-06
  confidence: 0.95
  test:
    given:
      voltage: 10
      resistance: 5
    expect:
      power: 20
- id: K-AC-001
  statement: 功率因数 = 有功功率 / 视在功率 (PF = P / S)
  category: ac
  scope: ac
  derive:
    output: power_factor
    expr: active_power / apparent_power
    inputs:
    - active_power
    - apparent_power
  variables:
    power_factor: '-'
    active_power: W
    apparent_power: VA
  source:
    name: 功率因数定义与改善 (Rohm R课堂) [行业技术资料(C 级线索, 待回 A 级复核)]
    url: https://techclass.rohm.com.cn/knowledge/si/s-si/21880
    retrieved: 2026-09-29
  confidence: 0.7
  test:
    given:
      active_power: 500
      apparent_power: 600
    expect:
      power_factor: 0.8333333333333334
- id: K-AC-002
  statement: 视在功率 = 电压有效值 × 电流有效值 (S = V × I, 单相)
  category: ac
  scope: ac
  derive:
    output: apparent_power
    expr: voltage_rms * current_rms
    inputs:
    - voltage_rms
    - current_rms
  source:
    name: 功率因数定义与改善 (Rohm R课堂) [行业技术资料(C 级线索, 待回 A 级复核)]
    url: https://techclass.rohm.com.cn/knowledge/si/s-si/21880
    retrieved: 2026-09-29
  confidence: 0.7
  test:
    given:
      voltage_rms: 220
      current_rms: 2.5
    expect:
      apparent_power: 550.0
- id: K-AC-003
  statement: 功率三角形 S² = P² + Q², 无功 Q = √(S² − P²)
  category: ac
  scope: ac
  derive:
    output: reactive_power
    expr: (apparent_power ** 2 - active_power ** 2) ** 0.5
    inputs:
    - apparent_power
    - active_power
  source:
    name: 功率因数定义与改善 (Rohm R课堂) [行业技术资料(C 级线索, 待回 A 级复核)]
    url: https://techclass.rohm.com.cn/knowledge/si/s-si/21880
    retrieved: 2026-09-29
  confidence: 0.7
  test:
    given:
      apparent_power: 600
      active_power: 500
    expect:
      reactive_power: 331.66247903554
- id: K-PWR-001
  statement: 电源转换效率 = 输出功率 / 输入功率 × 100% (η = Pout / Pin)
  category: power
  scope: output
  derive:
    output: efficiency
    expr: output_power / input_power * 100
    inputs:
    - output_power
    - input_power
  variables:
    efficiency: '%'
    output_power: W
    input_power: W
  source:
    name: 开关电源功率因数与转换效率 (知乎专栏) [行业技术资料(C 级线索, 待回 A 级复核)]
    url: https://zhuanlan.zhihu.com/p/1898726054841030421
    retrieved: 2026-09-29
  confidence: 0.7
  test:
    given:
      output_power: 599.4
      input_power: 644
    expect:
      efficiency: 93.07453416149067
- id: K-PWR-002
  statement: 电源损耗 = 输入功率 − 输出功率 (Loss = Pin − Pout)
  category: power
  scope: output
  derive:
    output: loss
    expr: input_power - output_power
    inputs:
    - input_power
    - output_power
  source:
    name: 影响开关电源效率的主要因素 (ADI) [行业技术资料(C 级线索, 待回 A 级复核)]
    url: https://www.analog.com/cn/resources/technical-articles/an-efficiency-primer-for-switchmode-dcdc-converter-power-supplies.html
    retrieved: 2026-09-29
  confidence: 0.7
  test:
    given:
      input_power: 644
      output_power: 599.4
    expect:
      loss: 44.60000000000002
- id: K-PWR-003
  statement: 交流输入功率 = 输入电压 × 输入电流 × 功率因数 (Pin = Vin × Iin × PF)
  category: power
  scope: input
  derive:
    output: input_power
    expr: input_voltage * input_current * power_factor
    inputs:
    - input_voltage
    - input_current
    - power_factor
  source:
    name: 功率因数定义 (onsemi hbd853) [行业技术资料(C 级线索, 待回 A 级复核)]
    url: https://www.onsemi.com/site/pdf/hbd853cn.pdf
    retrieved: 2026-09-29
  confidence: 0.7
  test:
    given:
      input_voltage: 220
      input_current: 2.5
      power_factor: 0.98
    expect:
      input_power: 539.0000000000001
- id: K-PWR-004
  statement: 降压变换器占空比 = 输出电压 / 输入电压 (D = Vout / Vin)
  category: power
  scope: topology
  derive:
    output: duty_cycle
    expr: output_voltage / input_voltage
    inputs:
    - output_voltage
    - input_voltage
  source:
    name: 影响开关模式DC-DC转换器效率的主要因素 (ADI) [行业技术资料(C 级线索, 待回 A 级复核)]
    url: https://www.analog.com/cn/resources/technical-articles/an-efficiency-primer-for-switchmode-dcdc-converter-power-supplies.html
    retrieved: 2026-09-29
  confidence: 0.7
  test:
    given:
      output_voltage: 12
      input_voltage: 48
    expect:
      duty_cycle: 0.25
- id: K-PWR-005
  statement: 电容 ESR 损耗 = 纹波电流有效值² × ESR (P = I_rms² × ESR)
  category: power
  scope: component
  derive:
    output: esr_loss
    expr: ripple_current_rms ** 2 * esr
    inputs:
    - ripple_current_rms
    - esr
  source:
    name: 影响开关模式DC-DC转换器效率的主要因素 (ADI) [行业技术资料(C 级线索, 待回 A 级复核)]
    url: https://www.analog.com/cn/resources/technical-articles/an-efficiency-primer-for-switchmode-dcdc-converter-power-supplies.html
    retrieved: 2026-09-29
  confidence: 0.7
  test:
    given:
      ripple_current_rms: 2
      esr: 0.05
    expect:
      esr_loss: 0.2
- id: K-THM-001
  statement: 温升 = 损耗功率 × 热阻 (ΔT = P × Rth)
  category: thermal
  scope: thermal
  derive:
    output: temp_rise
    expr: power_loss * thermal_resistance
    inputs:
    - power_loss
    - thermal_resistance
  variables:
    temp_rise: ℃
    power_loss: W
    thermal_resistance: ℃/W
  source:
    name: 热阻与温升基本关系 (电子散热通用公式) [行业技术资料(C 级线索, 待回 A 级复核)]
    url: https://techweb.rohm.com.tw/product/circuit-design/electric-circuit-design/21859
    retrieved: 2026-09-29
  confidence: 0.7
  test:
    given:
      power_loss: 45
      thermal_resistance: 0.5
    expect:
      temp_rise: 22.5
- id: K-THM-002
  statement: 结温 = 环境温度 + 损耗功率 × 热阻 (Tj = Ta + P × Rth)
  category: thermal
  scope: thermal
  derive:
    output: junction_temp
    expr: ambient_temp + power_loss * thermal_resistance
    inputs:
    - ambient_temp
    - power_loss
    - thermal_resistance
  source:
    name: 热设计基础 (通用电子散热) [行业技术资料(C 级线索, 待回 A 级复核)]
    url: https://techweb.rohm.com.tw/product/circuit-design/electric-circuit-design/21859
    retrieved: 2026-09-29
  confidence: 0.7
  test:
    given:
      ambient_temp: 25
      power_loss: 45
      thermal_resistance: 0.5
    expect:
      junction_temp: 47.5
- id: K-THM-003
  statement: '铝电解电容寿命倍增律: 纹波电流恒定时, 温度每降低 10℃ 寿命翻倍 (Arrhenius 近似)'
  category: thermal
  scope: reliability
  derive:
    output: life_factor
    expr: 2 ** ((rated_temp - operating_temp) / 10)
    inputs:
    - rated_temp
    - operating_temp
  variables:
    life_factor: ×
    rated_temp: ℃
    operating_temp: ℃
  source:
    name: 电解电容寿命预计方法 (业界通用 Arrhenius 模型)
    url: https://www.chemi-con.co.jp/en/faq/life/
    retrieved: 2026-09-29
  confidence: 0.9
  test:
    given:
      rated_temp: 105
      operating_temp: 65
    expect:
      life_factor: 16.0
- id: K-PROT-001
  statement: '保护回差方向性: 过压/过流/过温类 保护点 ≥ 恢复点+回差; 欠压类 恢复点 ≥ 保护点+回差'
  category: protection
  scope: protection
  constraint:
    shape: "@prefix sh: <http://www.w3.org/ns/shacl#> .\n@prefix ps: <https://aterag.example.org/power#>\
      \ .\nps:ProtectionHysteresisShape a sh:NodeShape ;\n    sh:targetClass ps:Protection ;\n    sh:sparql\
      \ [\n        sh:message \"保护点/恢复点/回差不满足方向性: trip={?trip} recovery={?recovery} hyst={?hyst} dir={?dir}\"\
      \ ;\n        sh:select \"\"\"\n            SELECT $this ?trip ?recovery ?hyst ?dir WHERE {\n   \
      \             $this ps:tripValue ?trip .\n                OPTIONAL { $this ps:recoveryValue ?recovery\
      \ . }\n                OPTIONAL { $this ps:hysteresis ?hyst . }\n                OPTIONAL { $this\
      \ ps:direction ?dir . }\n                FILTER (\n                    (COALESCE(?dir, 'over') !=\
      \ 'under' && BOUND(?recovery) &&\n                        (?trip < ?recovery + COALESCE(?hyst, 0)))\
      \ ||\n                    (COALESCE(?dir, 'over') = 'under' && BOUND(?recovery) &&\n           \
      \             (?recovery < ?trip + COALESCE(?hyst, 0)))\n                )\n            }\n    \
      \    \"\"\" ;\n    ] .\n"
  source:
    name: 规格书保护功能语义 (欠压恢复方向相反) + 规格方案 §5.3.4 [方案/规格书引用]
    url: local://spec-plan-5.3.4
    retrieved: 2026-09-29
  confidence: 0.85
  test:
    given:
      trip: 12
      recovery: 10
      hysteresis: 3
    expect:
      violation: true
- id: K-PROT-002
  statement: '保护/告警阈值之间需保持安全余量: 告警阈值 ≤ 保护点 − 设计余量 (如过流告警 ≤ 过流保护点 − 0.5A)'
  category: protection
  scope: protection
  constraint:
    shape: "@prefix sh: <http://www.w3.org/ns/shacl#> .\n@prefix ps: <https://aterag.example.org/power#>\
      \ .\nps:AlarmMarginShape a sh:NodeShape ;\n    sh:targetClass ps:Alarm ;\n    sh:sparql [\n    \
      \    sh:message \"告警阈值 {?alarm} 未低于保护点 {?trip} 减去余量 {?margin}\" ;\n        sh:select \"\"\"\n  \
      \          SELECT $this ?alarm ?trip ?margin WHERE {\n                $this ps:alarmValue ?alarm\
      \ .\n                $this ps:protectionTrip ?trip .\n                $this ps:margin ?margin .\n\
      \                FILTER (?alarm > ?trip - ?margin)\n            }\n        \"\"\" ;\n    ] .\n"
  source:
    name: PA601-D54A §4.3.4.1 遥信阈值语义 (通用化)
    url: local://pa601-4.3.4.1
    retrieved: 2026-09-29
  confidence: 0.9
  test:
    given:
      alarm: 11.8
      trip: 12
      margin: 0.5
    expect:
      violation: true
- id: K-FIX-001
  statement: 工装定位精度 = 被测参数公差 / 3 (精度三分法则)
  category: fixture
  scope: fixture
  derive:
    output: fixture_precision
    expr: param_tolerance / 3
    inputs:
    - param_tolerance
  variables:
    fixture_precision: 与公差同单位
    param_tolerance: 被测参数公差
  source:
    name: 规格方案 §5.2.3 工装精度公式 (测量系统 1/3~1/10 原则)
    url: local://spec-plan-5.2.3
    retrieved: 2026-09-29
  confidence: 0.95
  test:
    given:
      param_tolerance: 0.3
    expect:
      fixture_precision: 0.1
- id: K-FIX-002
  statement: '公差链均方根法: 总公差 = √(Σ 各环节公差²)'
  category: fixture
  scope: fixture
  derive:
    output: total_tolerance
    expr: sum(t * t for t in components) ** 0.5
    inputs:
    - components
  variables:
    total_tolerance: 同分量单位
    components: 公差分量列表
  source:
    name: 规格方案 §5.2.3 公差链公式 (RSS 法) [方案/规格书引用]
    url: local://spec-plan-5.2.3
    retrieved: 2026-09-29
  confidence: 0.85
  test:
    given:
      components:
      - 0.3
      - 0.4
    expect:
      total_tolerance: 0.5
- id: K-FIX-003
  statement: '探针选型-电流: 持续电流 > 5A 应选大电流探针(梅花针/高压探针), 普通探针 ≤ 3A 信号级'
  category: fixture
  scope: probe
  constraint:
    shape: "@prefix sh: <http://www.w3.org/ns/shacl#> .\n@prefix ps: <https://aterag.example.org/power#>\
      \ .\nps:ProbeCurrentShape a sh:NodeShape ;\n    sh:targetClass ps:Probe ;\n    sh:sparql [\n   \
      \     sh:message \"探针 {?this} 额定电流 {?rating} 低于测试点电流 {?need}\" ;\n        sh:select \"\"\"\n   \
      \         SELECT $this ?rating ?need WHERE {\n                $this ps:currentRating ?rating .\n\
      \                $this ps:requiredCurrent ?need .\n                FILTER (?rating < ?need)\n  \
      \          }\n        \"\"\" ;\n    ] .\n"
  source:
    name: Pogo Pin 规格选型指南 (promaxpogopin) + 规格方案 §5.2.4
    url: https://promaxpogopin.com/blog/pogo-pin/specifications
    retrieved: 2026-09-29
  confidence: 0.9
  test:
    given:
      rating: 3
      need: 11.1
    expect:
      violation: true
- id: K-FIX-004
  statement: 'pogo pin 直径-电流选型参考: Ø0.5mm≈1A(信号), Ø1.0mm≈2~3A, Ø1.5mm≈3~5A, Ø2.0mm≈5~6A, Ø2.5mm+≈10~40A(大电流)'
  category: fixture
  scope: probe
  derive:
    output: min_pin_diameter
    expr: 0.5 if current <= 1 else (1.0 if current <= 3 else (1.5 if current <= 5 else (2.0 if current
      <= 6 else 2.5)))
    inputs:
    - current
  variables:
    min_pin_diameter: mm
    current: A
  source:
    name: Pogo Pin Specifications (promaxpogopin)
    url: https://promaxpogopin.com/blog/pogo-pin/specifications
    retrieved: 2026-09-29
  confidence: 0.85
  test:
    given:
      current: 11.1
    expect:
      min_pin_diameter: 2.5
- id: K-FIX-005
  statement: 探针接触电阻典型 20~50mΩ, 工装链路接触电阻硬上限 0.1Ω; 大电流探针 10~30mΩ
  category: fixture
  scope: probe
  constraint:
    shape: "@prefix sh: <http://www.w3.org/ns/shacl#> .\n@prefix ps: <https://aterag.example.org/power#>\
      \ .\nps:ContactResistanceShape a sh:NodeShape ;\n    sh:targetClass ps:Probe ;\n    sh:property\
      \ [\n        sh:path ps:contactResistance ;\n        sh:maxInclusive 0.1 ;\n        sh:message \"\
      探针接触电阻必须 ≤ 0.1Ω\" ;\n    ] .\n"
  source:
    name: Pogo Pin 接触电阻数据 (CCP/cfeconn) + 规格方案 §5.3.3
    url: https://www.ccpcontactprobes.com/sites/default/files/2021-08/CCP_Contact_Probes_Company_Presentation_20210827_330ppi_0.pdf
    retrieved: 2026-09-29
  confidence: 0.95
  test:
    given:
      contact_resistance: 0.15
    expect:
      violation: true
- id: K-FIX-006
  statement: 所需测试通道数 = ceil(目标产能 × 单次测试时间 / 可用工作时间)
  category: fixture
  scope: capacity
  derive:
    output: required_channels
    expr: -(-throughput * test_time // available_time)
    inputs:
    - throughput
    - test_time
    - available_time
  variables:
    required_channels: 个
    throughput: 件/日
    test_time: s
    available_time: s/日
  source:
    name: 规格方案 §5.2.5 产能与寿命规则 [方案/规格书引用]
    url: local://spec-plan-5.2.5
    retrieved: 2026-09-29
  confidence: 0.85
  test:
    given:
      throughput: 1000
      test_time: 120
      available_time: 86400
    expect:
      required_channels: 2
- id: K-FIX-007
  statement: 探针剩余寿命 = 额定寿命 − 已使用次数; 剩余低于阈值触发维护预警
  category: fixture
  scope: probe
  derive:
    output: remaining_life
    expr: rated_life - used_count
    inputs:
    - rated_life
    - used_count
  source:
    name: 规格方案 §5.2.5 + pogo pin 寿命 100k 标称/50k~150k 实际 (Promax)
    url: https://promaxpogopin.com/blog/pogo-pin/rating-cycle-life-reliability
    retrieved: 2026-09-29
  confidence: 0.9
  test:
    given:
      rated_life: 100000
      used_count: 99000
    expect:
      remaining_life: 1000
- id: K-SAF-001
  statement: 绝缘电阻 ≥ 2MΩ (500Vdc, 相对湿度90%)
  category: safety
