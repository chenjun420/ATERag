    1.5mm、3000V 2.0mm; 加强绝缘取基本绝缘的 2 倍; 海拔 >2000m 须乘以修正系数(5000m 取 1.48)'
  category: safety
  scope: safety
  constraint:
    shape: "@prefix sh: <http://www.w3.org/ns/shacl#> .\n@prefix ps: <https://aterag.example.org/power#>\
      \ .\nps:ClearanceShape a sh:NodeShape ;\n    sh:targetClass ps:InsulationCoordination ;\n    sh:sparql\
      \ [\n        sh:message \"工作电压峰值 {?peak}V 下实际间隙 {?actual}mm 低于 {?ins} 绝缘所需 {?required}mm\" ;\n \
      \       sh:select \"\"\"\n            SELECT $this ?peak ?actual ?ins ?required WHERE {\n      \
      \          $this ps:workingVoltagePeak ?peak .\n                $this ps:actualClearanceMm ?actual\
      \ .\n                $this ps:insulationType ?ins .\n                BIND(IF(?peak <= 1500, 0.5,\
      \ IF(?peak <= 2000, 1.0, IF(?peak <= 2500, 1.5, 2.0))) AS ?base)\n                BIND(IF(?ins =\
      \ 'reinforced', ?base * 2, ?base) AS ?required)\n                FILTER (?actual < ?required)\n\
      \            }\n        \"\"\" ;\n    ] .\n"
  source:
