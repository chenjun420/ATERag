      \  sh:message \"过流保护模式 {?mode} 非法, 合法值: hiccup/constant-current/foldback/latch\" ;\n        sh:select\
      \ \"\"\"\n            SELECT $this ?mode WHERE {\n                $this ps:protectionMode ?mode\
      \ .\n                FILTER (?mode NOT IN ('hiccup', 'constant-current', 'foldback', 'latch'))\n\
      \            }\n        \"\"\" ;\n    ] .\n"
