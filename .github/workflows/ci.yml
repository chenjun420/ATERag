name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install ruff pyyaml
      # 工作流自身的 YAML 合法性: 裸标量里的 ": " 会让 GitHub 直接判定 Invalid workflow file,
      # 流水线根本不会执行 —— 必须在提交前拦下。
      - name: Validate workflow YAML
        run: python scripts/validate_workflow.py
      # config/*.yaml 同样栽过"未加引号裸标量含 ': '"的坑 (doc_profiles.yaml),
      # 且这类错误只在解析时暴露, 人眼看不出来 —— 必须在提交前拦下。
      - name: Validate project configs
        run: python scripts/validate_configs.py
      - name: ruff check
        run: ruff check src scripts tests
      - name: ruff format --check
        run: ruff format --check src scripts tests

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      # 本项目用 [dependency-groups] (PEP 735, uv 生态), 没有 [project.optional-dependencies],
      # 故 `pip install -e ".[dev]"` 会失败; 测试依赖在此显式安装。
      - name: Install project and test deps
        run: |
          pip install -e .
          pip install pytest pytest-asyncio
      - name: pytest
        run: python -m pytest tests/ -q

  selfcheck:
    name: Offline self-checks (rules / hardcode / py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      # 不再手工维护"最小依赖清单": verify_no_hardcoded 会经 server.py 连锁引入
      # mcp 客户端库等重依赖, 手工清单必然随代码演进而失效。直接装项目本身。
      - name: Install project
        run: pip install -e .
      - name: "Rule self-test (130 rules: 53 derive + 77 SHACL)"
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/rules_selftest.py power
      - name: Python 3.11 syntax compatibility
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/check_py311.py
      - name: No hardcoded rail whitelist / no confidence ceiling
        env:
          PYTHONIOENCODING: utf-8
          POSTGRES_DSN: postgresql://x:x@127.0.0.1/x
          LLM_BASE: http://x/v1
          LLM_MODEL: x
          EMBED_BASE: http://x
          EMBED_MODEL: x
        run: python scripts/verify_no_hardcoded.py
      # 产测条件抽取: 走 blocks 侧车的离线通道, 无需存储栈; PG 一致性检查会自行跳过。
      #
      # **跑的是自造夹具 PN2000-24A, 不是 PA601。** 原先这里跑 verify_conditions.py
      # (PA601, 79 条断言), 注释写着「规格书与 blocks 侧车在仓库内, 故 CI 可直接跑
      # 真实数据」—— 两句都与事实相反: PA601 规格书按 .gitignore 不入库(.gitignore
      # 第 49 行), rag_storage/ 整个目录也不入库。而 verify_conditions.py 在既无
      # 侧车又无规格书时是 `print("跳过"); return 0` —— 这条 CI 步骤**恒绿,
      # 79 条断言一条没跑**。verify_conditions.py 现已改为缺数据即退出码 1。
      #
      # verify_pn2000.py 覆盖同类断言(实体抽取 + 条件抽取 + 型号隔离, 14 条)且
      # 全部跑在已入库的自造夹具上, 是 CI 里真正能执行的那一份。
      - name: "Extraction end-to-end on self-made fixture (PN2000-24A)"
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/verify_pn2000.py
      # 4.3 (产测条件抽取范围) 必须零缺口 —— 范围内有未映射表格就意味着会漏条目。
      # 4.2 接口 / 4.4 可靠性的缺口是有意保留的范围外待办, 故只对 4.3 设门禁。
      # doc 指向已入库的自造夹具: 真实规格书不在仓库里(客户知识产权)。
      - name: "Table schema coverage in 4.3 (must be zero gaps)"
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/table_schema_report.py --doc "tests/fixtures/PN1000-48A 迷你规格书.md" --scope 4.3
      # 人工注记必须已签字: draft 状态的注记虽已生效 (语义优于正则), 但未经确认,
      # 下游只能按 confidence=proposed 过滤, 不得视为定稿。
      - name: "Annotation review sign-off (no drafts allowed)"
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/review_annotation.py -m PA601-D54A --check
      # 模板漂移门禁 (方案 §4.0③⑤)。**辅助工具**, 不是防线: 抽取过程本身对模板
      # 失配已 fail-closed (章节选不中抛 SectionKeywordNotFound, 表头不认识抛
      # TableSchemaUnmapped)。这里管的是抽取管不到的那一类 —— 参数变了、抽取照样
      # 跑完、结果看着正常但其实 role/limits_to 判错了。
      #
      # 跑自造夹具 PN1000-48A(与 PA601 同属 power_spec_cn 档案, 章节形状一致)。
      # blocks 侧车由 scripts/fixture_blocks.py 从夹具现生成到临时目录 —— 侧车是
      # 派生物, 入库会与夹具漂移; PN1000-48A 的基线已在 config/template_baseline.yaml
      # 里(PA601 的条目保留着, 本机有真实数据时仍可比对)。
      - name: "Template drift gate (fingerprint + coverage baseline)"
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -c "import sys; sys.path.insert(0,'scripts'); import fixture_blocks; print(fixture_blocks.shared_dir())" > "$RUNNER_TEMP/blocks"
          python scripts/template_drift.py --model PN1000-48A --blocks-dir "$(cat "$RUNNER_TEMP/blocks")"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure .env is not tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env 被提交进仓库, 立即撤销该提交并轮换所有密钥"
            exit 1
          fi
          echo "OK: .env 未入库"
      - name: Fail if hardcoded credentials appear in tracked files
        run: |
          set -euo pipefail
          hits=$(git grep -nEI '(sk-[A-Za-z0-9]{20,}|tvly-[A-Za-z0-9_-]{20,})' -- . \
                 ':!*.example' ':!.github' || true)
          if [ -n "$hits" ]; then
            echo "::error::检测到疑似硬编码密钥:"
            echo "$hits"
            exit 1
          fi
          echo "OK: 未发现硬编码密钥"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
