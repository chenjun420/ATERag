# Alembic config.
#
# NOTE: this file is read with encoding="locale" by alembic. On a GBK-locale
# Windows host that raises UnicodeDecodeError, so comments here MUST stay
# ASCII. Chinese rationale lives in alembic/env.py and the migration files
# (those are read as UTF-8 source, not as config).
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# Intentionally empty. The URL is injected by alembic/env.py from
# aterag.config.Settings.postgres_dsn -- the same source the app uses at
# runtime. Duplicating the DSN here guarantees the two drift apart.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S