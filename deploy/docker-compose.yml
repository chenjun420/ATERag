# ATERag 存储栈 - 192.168.5.25 (Debian 12 ARM64, Podman rootful)
# 组件: PostgreSQL 17 (pgvector + Apache AGE + pg_textsearch + zhparser)
# 用法: 在板上 cd ~/aterag && sudo podman-compose up -d --build
name: aterag-storage

services:
  postgres:
    build: ./postgres
    image: localhost/aterag-postgres:latest
    container_name: aterag-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: powerspec
      POSTGRES_PASSWORD: ${PG_APP_PASSWORD:?set PG_APP_PASSWORD in .env}
      POSTGRES_DB: power_specs
    volumes:
      - ../pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powerspec -d power_specs"]
      interval: 10s
      retries: 12
      start_period: 30s

# (qdrant 服务已随 ADR-014 移除: 检索层由 pgvector 承担)
