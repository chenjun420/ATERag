# 文档档案 (doc profiles): 抽取侧的"认知"外置。
#
# 与 config/table_schemas.yaml 的分工:
#   table_schemas.yaml  管"表怎么读"  (表头 -> 规范字段, ingest 侧)
#   doc_profiles.yaml   管"抽什么/怎么判" (章节选择 / 剔除词 / 角色先验, extract 侧)
#
# 换文档模板 = 新增一个 profile; 抽取代码不含任何具体文档的中文词。
version: 1

# 未在 registry.yaml 显式指定 profile 的型号用这个
default_profile: power_spec_cn

# ---- 模板身份 (方案 §4.0①) ----
#
# 档案 ≠ 模板。档案是「这份文档怎么解析」, 模板是「这一族文档长什么样」的族系
# 标识, 两者分开才能回答两个不同的问题:
#   template_id + fingerprint —— 这段抽取用的是哪套参数, 参数有没有被改过
#
# power_spec_cn 与 power_spec_cn_pn2000 **同属一个模板族** (同一家的定制电源
# 技术规格书, 只是章节号不同: 4.3 vs 2)。把它们挂同一个 template_id, 基线就能
# 按模板维度对齐; 挂两个 id 则永远看不出「这俩其实是同一个模板被改过章节号」。
#
# template_version 是**人工维护**的版本号, 故意不由代码推导: 它记的是「这版模板
# 是谁在什么时候改的」, 指纹只回答「变没变」。两者都要 —— 光有指纹时, 事后看到
# 一份历史产物只能知道参数不同, 不知道当时用的是哪个版本号。
#
# 变更约定: 改会改变抽取结果的部分 (section_keywords / exclude_words /
# section_priors / 表字段白名单) 时, template_version 递增一位, 并同步更新
# config/template_baseline.yaml 的对应条目 (scripts/template_drift.py 会红)。

profiles:

  # 中兴系电源定制规格书 (PA601-D54A / PN2000-24A 等)
  power_spec_cn:
    template_id: power_spec_cn_v1
    template_version: "1.0"
    description: 定制电源技术规格书 (章节 4.3 = 功能/性能要求)

    # 章节选择: 标题链命中任一关键字的章节 + 其全部子章节
    section_keywords:
      - 功能/性能要求

    # 条目剔除词表 (等级列 / 备注整格精确匹配)
    exclude_words:
      - 不要求
      - 无要求
      - 不做要求
      - 无此要求

    # 自由文本块是否也作为候选条目 (默认否: 表格才是产测条件的载体,
    # 但被跳过的散文会计入 stats.prose_skipped, 不会静默消失)
    include_prose: false

    # 章节角色先验: 决定"限值列"归到激励侧还是响应侧
    # limits_to: input | output | both
    # 注意: 说明文字若含 ": " 必须加引号 —— YAML 会把裸标量里的冒号当键值分隔符
    section_priors:
      "4.3.1":
        role: input_domain
        limits_to: input
        note: "输入特性: 88~290Vac 本身是激励域 (产测在这些点加激励, 验输出是否正常)"
      "4.3.2":
        role: output_spec
        limits_to: output
        note: "输出特性: 限值即响应判据"
      "4.3.3":
        role: protection_response
        limits_to: both
        note: "保护点既是激励阈值(升压到多少触发)也是响应判据"
      "4.3.4":
        role: signal_io
        limits_to: output
        note: "监控功能: 告警/遥测/遥控均为产品输出信号"
      "4.3.5":
        role: other
        limits_to: output

    # 引用识别措辞: 代码不含具体文档词汇, 声明在档案里。
    # 显式留空即关闭引用穿透 (stats.reference_resolution 会记为 disabled, 不会静默)。
    reference_markers:
      - 详见
      - 参见
      - 见
      - 按
      - 依据

    # 需求编号形态 (标题里抓 SR 号), 正则字符串
    req_id_pattern: '\b([A-Z]{2,6}[0-9A-Z]*(?:-[A-Z0-9]+)+)\b'

    # 已评审的待审条目处置 (需求方 2026-09-29 确认)
    #
    # 作用: 让"人工判定过不提取"变成数据, 而不是靠人记得。命中的条目不再进入
    # needs_review 队列, 改为进 reviewed_dispositions 并附判定理由 —— 既止住重复
    # 提示, 又保留"当初为什么没抽"的审计痕迹。新出现的未判定条目仍照常进队列。
    #
    # verdict 取值:
    #   not_test_condition   非产测条件 (设计/功能/选型约束, 产测不验)
    #   covered_by_sibling   本行无独立数据, 内容已由同编号的其他档位/电压轨抽出
    #   not_machine_readable 判据存在于图表等非文本载体, 文本抽取不可达
    review_dispositions:
      - id: 4.3.1-breaker-selection
        kind: unmapped_table
        section: "4.3.1"
        match: "输入类型 | 插座/电源输入电流 | 支路空开 | 总空开/熔丝"
        verdict: not_test_condition
        reason: "支路/总路空开与熔丝选型参考, 产测不验"
      - req_id: SR-PA601-D54A-1101
        verdict: covered_by_sibling
        reason: "Vdc 档限值全为 '-', 无独立数据; Vac 档 88~290Vac 已抽出"
      - req_id: SR-PA601-D54A-1105
        verdict: not_machine_readable
        reason: "输入冲击电流判据在注3 曲线图内, 非文本可机读 (ETSI EN 300 132-1 限值)"
      - req_id: SR-PA601-D54A-1110
        verdict: not_test_condition
        reason: "接地方式属设计约束, 由设计评审与可靠性验证覆盖, 不入产测条件"
      - req_id: SR-PA601-D54A-1217
        verdict: covered_by_sibling
        reason: "3.45V 轨温度系数为 '-', 无独立数据; -54V 轨 ±0.02%/℃ 已抽出"
      - req_id: SR-PA601-D54A-1222
        verdict: not_test_condition
        reason: "ORING 为功能实现要求, 由功能验证覆盖, 不入产测条件"
      - req_id: SR-PA601-D54A-1225
        verdict: not_test_condition
        reason: "输出共地方式属设计约束, 不入产测条件"
      - req_id: SR-PA601-D54A-1312
        verdict: not_test_condition
        reason: "保护时各路输出相关性由保护功能验证覆盖, 不入产测条件"

    # 未登记先验的章节使用的兜底角色
    default_role: stimulus_response
    default_limits_to: output

  # PN2000-24A 模板 (章节 2 技术要求, 与中兴系 4.3 功能/性能要求 是两套结构)
  #
  # 存在的理由: PN2000-24A 登记在 data/registry.yaml, 但章节树完全不同
  # (2 技术要求 / 2.1 工作环境条件 / 2.2 输出规格 / 2.3 保护功能 /
  # 2.4 信号接口 / 2.5 遥测功能), power_spec_cn 的「功能/性能要求」
  # 关键字在它里面一个都命中不了 -> SectionKeywordNotFound,
  # 「登记在册却进不来」。**换模板只改本文件, 不改代码** (方案 §11.4 A19)。
  power_spec_cn_pn2000:
    # 与 power_spec_cn 同族: 同一家的定制电源技术规格书, 只是章节号从 4.3 变成 2。
    template_id: power_spec_cn_v1
    template_version: "1.0"
    description: PN2000-24A 定制电源技术规格书 (章节 2 技术要求)
    section_keywords:
      # 逐个子章节点名, 而非笼统写「技术要求」: 2.4/2.5 的信号与遥测表
      # 由信号/遥测 schema 产实体, 但它们不是产测条件 (无限值列), 收编进来
      # 会让条件装配拿到一批空条件的条目。
      - 工作环境条件
      - 输出规格
      - 保护功能

    exclude_words:
      - 不要求
      - 无要求
      - 不做要求
      - 无此要求

    include_prose: false

    section_priors:
      "2.1":
        role: input_domain
        limits_to: input
        note: "工作环境条件: 输入电压/频率/工作温度本身是激励域 (产测在这些点加激励, 验输出是否正常)"
      "2.2":
        role: output_spec
        limits_to: output
        note: "输出规格: 限值即响应判据; 轨道列显式写出 (-48V)"
      "2.3":
        role: protection_response
        limits_to: both
        note: "保护功能: 保护点既是激励阈值也是响应判据"
      "2.4":
        role: signal_io
        limits_to: output
      "2.5":
        role: signal_io
        limits_to: output

    reference_markers:
      - 详见
      - 参见
      - 见
      - 按
      - 依据

    req_id_pattern: '\b([A-Z]{2,6}[0-9A-Z]*(?:-[A-Z0-9]+)+)\b'

    default_role: stimulus_response
    default_limits_to: output

  # 极简示例: 只做章节选择 + 剔除, 不做语义装配 (用于对照与冒烟)
  minimal:
    # 独立的模板族: 它不按任何真实文档的章节结构, 只做对照与冒烟。
    # 刻意不与 power_spec_cn_v1 同族 —— 挂了同一个 id 就会让「改了 minimal」
    # 看起来像「改了真实模板」, 基线也就跟着一起红。
    template_id: minimal_v1
    template_version: "1.0"
    description: 只抽取条目, 不拆输入/输出条件
    section_keywords:
      - 功能/性能要求
    exclude_words:
      - 不要求
      - 无要求
    include_prose: false
