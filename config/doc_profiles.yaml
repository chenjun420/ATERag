# 文档档案 (doc profiles): 抽取侧的"认知"外置。
#
# 与 config/table_schemas.yaml 的分工:
#   table_schemas.yaml  管"表怎么读"  (表头 -> 规范字段, ingest 侧)
#   doc_profiles.yaml   管"抽什么/怎么判" (章节选择 / 剔除词 / 角色先验, extract 侧)
#
# 换文档模板 = 新增一个 profile; 抽取代码不含任何具体文档的中文词。
version: 1

# 未在 registry.yaml 显式指定 profile 的型号用这个
default_profile: power_spec_cn

profiles:

  # 中兴系电源定制规格书 (PA601-D54A / PN2000-24A 等)
  power_spec_cn:
    description: 定制电源技术规格书 (章节 4.3 = 功能/性能要求)

    # 章节选择: 标题链命中任一关键字的章节 + 其全部子章节
    section_keywords:
      - 功能/性能要求

    # 条目剔除词表 (等级列 / 备注整格精确匹配)
    exclude_words:
      - 不要求
      - 无要求
      - 不做要求
      - 无此要求

    # 自由文本块是否也作为候选条目 (默认否: 表格才是产测条件的载体,
    # 但被跳过的散文会计入 stats.prose_skipped, 不会静默消失)
    include_prose: false

    # 章节角色先验: 决定"限值列"归到激励侧还是响应侧
    # limits_to: input | output | both
    # 注意: 说明文字若含 ": " 必须加引号 —— YAML 会把裸标量里的冒号当键值分隔符
    section_priors:
      "4.3.1":
        role: input_domain
        limits_to: input
        note: "输入特性: 88~290Vac 本身是激励域 (产测在这些点加激励, 验输出是否正常)"
      "4.3.2":
        role: output_spec
        limits_to: output
        note: "输出特性: 限值即响应判据"
      "4.3.3":
        role: protection_response
        limits_to: both
        note: "保护点既是激励阈值(升压到多少触发)也是响应判据"
      "4.3.4":
        role: signal_io
        limits_to: output
        note: "监控功能: 告警/遥测/遥控均为产品输出信号"
      "4.3.5":
        role: other
        limits_to: output

    # 引用识别措辞: 代码不含具体文档词汇, 声明在档案里。
    # 显式留空即关闭引用穿透 (stats.reference_resolution 会记为 disabled, 不会静默)。
    reference_markers:
      - 详见
      - 参见
      - 见
      - 按
      - 依据

    # 需求编号形态 (标题里抓 SR 号), 正则字符串
    req_id_pattern: '\b([A-Z]{2,6}[0-9A-Z]*(?:-[A-Z0-9]+)+)\b'

    # 已评审的待审条目处置 (需求方 2026-09-29 确认)
    #
    # 作用: 让"人工判定过不提取"变成数据, 而不是靠人记得。命中的条目不再进入
    # needs_review 队列, 改为进 reviewed_dispositions 并附判定理由 —— 既止住重复
    # 提示, 又保留"当初为什么没抽"的审计痕迹。新出现的未判定条目仍照常进队列。
    #
    # verdict 取值:
    #   not_test_condition   非产测条件 (设计/功能/选型约束, 产测不验)
    #   covered_by_sibling   本行无独立数据, 内容已由同编号的其他档位/电压轨抽出
    #   not_machine_readable 判据存在于图表等非文本载体, 文本抽取不可达
    review_dispositions:
      - id: 4.3.1-breaker-selection
        kind: unmapped_table
        section: "4.3.1"
        match: "输入类型 | 插座/电源输入电流 | 支路空开 | 总空开/熔丝"
        verdict: not_test_condition
        reason: "支路/总路空开与熔丝选型参考, 产测不验"
      - req_id: SR-PA601-D54A-1101
        verdict: covered_by_sibling
        reason: "Vdc 档限值全为 '-', 无独立数据; Vac 档 88~290Vac 已抽出"
      - req_id: SR-PA601-D54A-1105
        verdict: not_machine_readable
        reason: "输入冲击电流判据在注3 曲线图内, 非文本可机读 (ETSI EN 300 132-1 限值)"
      - req_id: SR-PA601-D54A-1110
        verdict: not_test_condition
        reason: "接地方式属设计约束, 由设计评审与可靠性验证覆盖, 不入产测条件"
      - req_id: SR-PA601-D54A-1217
        verdict: covered_by_sibling
        reason: "3.45V 轨温度系数为 '-', 无独立数据; -54V 轨 ±0.02%/℃ 已抽出"
      - req_id: SR-PA601-D54A-1222
        verdict: not_test_condition
        reason: "ORING 为功能实现要求, 由功能验证覆盖, 不入产测条件"
      - req_id: SR-PA601-D54A-1225
        verdict: not_test_condition
        reason: "输出共地方式属设计约束, 不入产测条件"
      - req_id: SR-PA601-D54A-1312
        verdict: not_test_condition
        reason: "保护时各路输出相关性由保护功能验证覆盖, 不入产测条件"

    # 未登记先验的章节使用的兜底角色
    default_role: stimulus_response
    default_limits_to: output

  # 极简示例: 只做章节选择 + 剔除, 不做语义装配 (用于对照与冒烟)
  minimal:
    description: 只抽取条目, 不拆输入/输出条件
    section_keywords:
      - 功能/性能要求
    exclude_words:
      - 不要求
      - 无要求
    include_prose: false
