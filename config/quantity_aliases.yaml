# 型号事实的标题别名表 (方案 §11.7 衔接层)
#
# 解决的问题
# ----------
# Datalog 推导要从实体里取三个数值 (额定输出电压 / 输出电流 / 整机效率),
# 过去靠 ``mcp_server/server.py`` 里三个中文子串判定标题。规格书换个措辞
# ("标称输出电压" / "额定输出电流"), 取数就静默变成 None, 而下游看到的是
# "该型号没有这个事实" —— 措辞问题伪装成数据缺失, 最难查。
#
# 为什么默认 exact 而不是 contains
# -------------------------------
# 实测 PA601-D54A 的 Requirement 标题里有一整族邻近词:
#   额定输出电压 / 输出电压 / 输出电压范围 / 输出电压可调节范围 / 输出电压整定范围
#   / 输出电压上升时间 / 输出功率 / 输入输出电压 ...
# 用子串匹配写 "输出电压" 会把「输出电压上升时间」「输出电压可调节范围」
# 一并认成额定输出电压, 取到错的数还取得到 —— 比取不到更坏。
# 所以默认 exact; 只有确有需要时才逐条声明 prefix/contains, 并写明理由。
#
# 与 l0.concept_alias 的关系
# ------------------------
# **不是同一份数据, 不要互相导入或声称同步。** ``l0.concept_alias`` 是本体层
# 概念术语的同义词 (concept_id 外键指向 l0.concept), 目前无消费者; 本表是
# 规格书**标题**的同义词, 消费者是 ``_model_facts``。两者碰巧都叫「别名」,
# 混用会造出一份谁也不读的第三份副本 (红线 4)。
#
# 加载期校验 (extract/configs.py): 别名跨事实必须互斥 —— 一条标题同时是两个
# 事实的别名时, 取哪个都可能是错的, 那就必须在加载期报错而不是靠 elif 顺序。

version: 1

facts:
  # 额定输出电压: 推导的额定电压源。取 typ, 缺失依次退 min / max; 取绝对值
  # (-54V 这类负号轨名会写成负值)。
  voltage:
    title:
      - 额定输出电压
      - 标称输出电压
      - 额定输出电压(典型值)
    match: exact
    value_from: [typ, min, max]
    abs_value: true

  # 额定输出电流: 取 max (规格书给的是范围上限), 缺失不猜。
  # 主轨由「电流最大者」动态选出, 不在这里写死轨名。
  current:
    title:
      - 输出电流
      - 额定输出电流
      - 最大输出电流
    match: exact
    value_from: [max]

  # 整机效率下限: 取 min (效率给的是范围, 下限才是保底值)。
  efficiency_min:
    title:
      - 整机效率
      - 效率
    match: exact
    value_from: [min]