- id: F_M.1.1_STD_UNCERTAINTY_A
  standard_ref: GB/T 27418-2017
  source: 'GB/T 27418-2017 测量不确定度评定和表示(现行, 发布 2017-12-29 / 实施 2018-07-01, CCS A50 / ICS 01.040.17, 修改采用 ISO/IEC Guide 98-3:2008, 归口 TC261, 上次复审 2025-04-30 继续有效); 国家标准全文公开 openstd.samr.gov.cn/bzgk/std/newGbInfo?hcno=4BAEA7D58DD78FD31710D69E0F9CDCF7; 另 CNAS-CL01-G003:2021《测量不确定度的要求》明确以 GB/T 27418 为制定依据'
  checked: '2026-10-08'
  confidence: 0.85
  note: 'A 类(标准不确定度)、B 类、合成、扩展、相对不确定度是 GB/T 27418 的核心内容(该标准术语表直接含「测量不确定度」「标准不确定度」「合成标准不确定度」)。该标准适用范围明确含「在生产过程中利用测量活动进行的质量控制和质量保证」—— 正是产测场景; CNAS-CL01-G003 还要求实验室的评定程序符合 GB/T 27418, 所以这一族对产测是强制要求。'
