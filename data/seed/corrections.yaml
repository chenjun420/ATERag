load_conditions:
# authority_kind 定 project_defined(不是 industry): 「半载 = 满载×50%」是
# **本项目的约定**, 不是业界通行术语 —— 标成 industry 会让下游以为有个
# 行业标准背书。confidence 也不再顶格 1.0: 项目约定在同一量纲里是 0.5
# (与 CREDIBILITY_BY_AUTHORITY 的 project_defined 一致)。顶格 1.0 的实际
# 后果是「本项目的约定」在查询端显示成「已验证的外部事实」。
