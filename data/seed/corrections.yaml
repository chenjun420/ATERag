# --- YD/T 4523-2023 §3.1 基本术语 ---
- id: CAPACITY
  zh: 容量
  en: capacity
  clause: 3.1.1
  definition: 在规定的条件下，系统、设备、装置等所能够提供的能力。
  source: YD/T 4523-2023 报批/备案稿公开文本(guifanku.com/854213、max.book118.com/html/2023/0825/5204333143010314.htm)
  standard_ref: YD/T 4523-2023
  checked: '2026-10-05'
  confidence: 0.8
  note: "条款号读自报批/备案稿公开文本; 正式版(2024-04-01 实施)若有改号以正式版为准, 复核后改此处。"
- id: RATED_CAPACITY
  zh: 额定容量
  en: rated capacity
  clause: 3.1.2
  synonyms: [额定容量, rated capacity]
  source: YD/T 4523-2023 报批/备案稿公开文本(guifanku.com/854213、max.book118.com/html/2023/0825/5204333143010314.htm)
  standard_ref: YD/T 4523-2023
  checked: '2026-10-05'
  confidence: 0.8
  note: "与「标称容量」(3.1.3)是两个不同词条, 不是同一意义的两种叫法: 标称容量是厂家标定并承诺的容量。「额定=典型值」的口径只适用于 PA601 §3 术语表语境下的参数列, 不适用于容量。条款号读自报批/备案稿公开文本; 正式版(2024-04-01 实施)若有改号以正式版为准, 复核后改此处。"
- id: NOMINAL_CAPACITY
  zh: 标称容量
  en: nominal capacity
  clause: 3.1.3
  synonyms: [标称容量, nominal capacity]
  source: YD/T 4523-2023 报批/备案稿公开文本(guifanku.com/854213、max.book118.com/html/2023/0825/5204333143010314.htm)
  standard_ref: YD/T 4523-2023
  checked: '2026-10-05'
  confidence: 0.8
  note: "厂家标定并承诺系统、设备、装置等能够提供的容量。与「额定容量」分立立条, 不可互换。条款号读自报批/备案稿公开文本; 正式版(2024-04-01 实施)若有改号以正式版为准, 复核后改此处。"
- id: LOAD_SHARING
  zh: 均分负载
  en: load sharing
  clause: 3.1.4
  synonyms: [均分负载, load sharing, 均流, 并联均流]
  definition: 多台同类型设备并联工作时，将各台设备自动按相同负载率分配负载的能力。
  source: YD/T 4523-2023 报批/备案稿公开文本(guifanku.com/854213、max.book118.com/html/2023/0825/5204333143010314.htm)
  standard_ref: YD/T 4523-2023
  checked: '2026-10-05'
  confidence: 0.8
  note: "YD/T 4523 立条名为「均分负载」, 而整流器类标准(YD/T 731)与业界口头普遍说「均流」—— 同指并联设备按相同负载率分配负载的能力, 属名称差异, 故并入同义词。**但注意**: 该能力本身是软性描述; 可测的量化指标是「均流不平衡度」, 那是另一个概念(见 YD/T 731 条款), 两者不是同义词。条款号读自报批/备案稿公开文本; 正式版(2024-04-01 实施)若有改号以正式版为准, 复核后改此处。"
- id: CURRENT_LIMITING
  zh: 限流
  en: current limiting
  clause: 3.1.5
  synonyms: [限流, current limiting]
  definition: 工作在稳压状态的整流设备在输出电流超过该设备设定的限定值时，输出电压自动降低，限制输出电流上升。
  source: YD/T 4523-2023 报批/备案稿公开文本(guifanku.com/854213、max.book118.com/html/2023/0825/5204333143010314.htm)
  standard_ref: YD/T 4523-2023
  checked: '2026-10-05'
  confidence: 0.8
  note: "这里是**工作模式**(恒压稳态下的自动降压限流), 不是保护动作。PA601 的「输出过流保护」是保护动作, 与本条不是一回事; 门限值另见「限流门限电流」。条款号读自报批/备案稿公开文本; 正式版(2024-04-01 实施)若有改号以正式版为准, 复核后改此处。"
- id: SLEEPING
