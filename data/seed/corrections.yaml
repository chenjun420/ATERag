# ===========================================================================
# 新增概念: 通信电源术语(YD/T 系列)
# ===========================================================================
#
# 权威词表是 YD/T 4523-2023《通信电源术语和定义》—— 通信电源领域的对口术语标准,
# 起草单位含中国移动设计院、中国信通院、中国电信、中兴通讯。方案 md 没有它,
# 而「休眠」「负载下电」「软启动」「N+X 冗余」这类日常用词方案里一个都没有。
#
# 同义词原则: 跨标准/跨版本含义相同、只是叫法或译法不同的, 并入 synonyms 而不
# 另立实体; 含义有差别的记进 note, **不合并**。

concepts_add:
# --- YD/T 4523-2023 §3.1 基本术语 ---
- id: CAPACITY
  zh: 容量
  en: capacity
  clause: 3.1.1
  definition: 在规定的条件下，系统、设备、装置等所能够提供的能力。
  source: YD/T 4523-2023 报批/备案稿公开文本(guifanku.com/854213、max.book118.com/html/2023/0825/5204333143010314.htm)
  standard_ref: YD/T 4523-2023
  checked: '2026-10-05'
  confidence: 0.8
  note: "条款号读自报批/备案稿公开文本; 正式版(2024-04-01 实施)若有改号以正式版为准, 复核后改此处。"
- id: RATED_CAPACITY
  zh: 额定容量
  en: rated capacity
  clause: 3.1.2
  synonyms: [额定容量, rated capacity]
  source: YD/T 4523-2023 报批/备案稿公开文本(guifanku.com/854213、max.book118.com/html/2023/0825/5204333143010314.htm)
  standard_ref: YD/T 4523-2023
  checked: '2026-10-05'
  confidence: 0.8
  note: "与「标称容量」(3.1.3)是两个不同词条, 不是同一意义的两种叫法: 标称容量是厂家标定并承诺的容量。「额定=典型值」的口径只适用于 PA601 §3 术语表语境下的参数列, 不适用于容量。条款号读自报批/备案稿公开文本; 正式版(2024-04-01 实施)若有改号以正式版为准, 复核后改此处。"
- id: NOMINAL_CAPACITY
  zh: 标称容量
  en: nominal capacity
  clause: 3.1.3
  synonyms: [标称容量, nominal capacity]
  source: YD/T 4523-2023 报批/备案稿公开文本(guifanku.com/854213、max.book118.com/html/2023/0825/5204333143010314.htm)
  standard_ref: YD/T 4523-2023
  checked: '2026-10-05'
  confidence: 0.8
  note: "厂家标定并承诺系统、设备、装置等能够提供的容量。与「额定容量」分立立条, 不可互换。条款号读自报批/备案稿公开文本; 正式版(2024-04-01 实施)若有改号以正式版为准, 复核后改此处。"
- id: LOAD_SHARING
  zh: 均分负载
  en: load sharing
  clause: 3.1.4
  synonyms: [均分负载, load sharing, 均流, 并联均流]
  definition: 多台同类型设备并联工作时，将各台设备自动按相同负载率分配负载的能力。
  source: YD/T 4523-2023 报批/备案稿公开文本(guifanku.com/854213、max.book118.com/html/2023/0825/5204333143010314.htm)
