# --- YD/T 1817-2017 「保护点及回差」 ---
- id: HYSTERESIS
  zh: 回差
  en: hysteresis
  synonyms: [回差, hysteresis, 复归回差, 返回回差, 回差带]
  definition: 动作值(保护点)与恢复值之差。输入越过保护点时进入保护, 需回落到恢复点才退出。
  source: YD/T 1817-2017 正文公开文本「保护点及回差」条款(bzko.com/std/new225586.html); 版本状态经工标网 csres.com/detail/298778.html 核对
  standard_ref: YD/T 1817-2017
  checked: '2026-10-05'
  confidence: 0.9
  note: "**用户点名要查的词, 确认是电源领域真实技术名词。** YD/T 1817-2017 以「保护点及回差」立节, 并给出欠压/过压的保护点与恢复点线性插值规则(设定值 43V 时恢复点 46V; 保护点 46V 时恢复点 47V)。国标层面 GB/T 2900.17-2024(等同 IEC 60050-447:2020)新增「复归回差」「返回回差」两术语, 故并入 synonyms。**关键区分**: 回差是**差值**, 与「返回系数」这个**比值**(GB/T 14598.127-2013 3.10 定义)不是一回事, 不可互替。YD/T 1817-2026 版 2026-11-01 实施, 条款号届时需重新核对。"
