  checked: '2026-10-05'
  confidence: 0.9
  note: "**与「回差」(HYSTERESIS)是两个不同的量**: 本条是比值, 回差是差值。方案 md 原本给本条加了别名「OCP回差/OVP回差/OTP回差」, 已按标准删除 —— 比值与差值互换会让保护整定算错。YD/T 1817-2017 的「保护点及回差」用的才是差值语义。**另注意** GB/T 14598.127-2013 3.6「返回时间 disengaging time」与 3.7「复归时间 reset time」是两个不同词条(起始触发点不同: 前者从「输入激励量产生能引起返回的规定变化」起算, 后者从「特性量发生变化」起算), 勿并。zh 保留业界通行的「返回系数」以便检索, 标准正名存 standard_term, 两套名字都在 synonyms 里。"
- id: SET_OTP_RETURN
  standard_term: 复归系数
  synonyms: [过温保护返回系数, OTP return ratio, 复归系数, reset ratio, disengaging ratio]
  clause: '3.10'
  definition: 继电器刚好退出启动状态(启动信号由开变为关)的电压与元件的实际启动电压之间的比值。通常规定为百分数, 过电压元件小于100%, 欠电压元件大于100%。
  standard_ref: GB/T 14598.127-2013
  source: GB/T 14598.127-2013《量度继电器和保护装置 第127部分:过/欠电压保护功能要求》3.10(等同采用 IEC 60255-127:2010)正文; 版本现行性经工标网 csres.com/detail/233986.html 核对
  checked: '2026-10-05'
  confidence: 0.9
  note: "过温保护属温度类元件, 标准 3.10 的过/欠电压说明不直接适用; 但「复归系数=返回电压/启动电压」这一定义式对任何保护型元件通用。**与「回差」(HYSTERESIS)是两个不同的量**: 本条是比值, 回差是差值。方案 md 原本给本条加了别名「OCP回差/OVP回差/OTP回差」, 已按标准删除 —— 比值与差值互换会让保护整定算错。YD/T 1817-2017 的「保护点及回差」用的才是差值语义。**另注意** GB/T 14598.127-2013 3.6「返回时间 disengaging time」与 3.7「复归时间 reset time」是两个不同词条(起始触发点不同: 前者从「输入激励量产生能引起返回的规定变化」起算, 后者从「特性量发生变化」起算), 勿并。zh 保留业界通行的「返回系数」以便检索, 标准正名存 standard_term, 两套名字都在 synonyms 里。"
- id: COND_VIN_MIN
  standard_ref: GB 4943.1-2022
  clause: 1.4.5
  source: 'GB 4943.1 信息技术设备的安全 第1部分 通用要求 条文(电源容差/额定电压容差); 全国标准信息公共服务平台 std.samr.gov.cn 标准状态页'
  checked: '2026-10-08'
  confidence: 0.8
  note: 'GB 4943.1 规定额定电压的容差(相对 IEC 60950-1 的 +6%/-10%, 我国改为 +10%/-10%), 即输入电压下限的判定依据。本条只挂「下限由哪个标准判」, 不给具体数值 —— 数值随型号而异, 由规格书给出。'
- id: COND_VIN_MAX
  standard_ref: GB 4943.1-2022
  clause: 1.4.5
  source: 'GB 4943.1 信息技术设备的安全 第1部分 通用要求 条文(电源容差/额定电压容差); 全国标准信息公共服务平台 std.samr.gov.cn 标准状态页'
  checked: '2026-10-08'
  confidence: 0.8
  note: '同 COND_VIN_MIN —— 上限由 GB 4943.1 的额定电压容差判。不给数值, 数值随型号而异。'
- id: COND_COOLING_FORCED
  standard_ref: GB 4943.1-2022
  source: 'GB 4943.1 信息技术设备的安全 第1部分 通用要求 温升试验(强制风冷条件下测温升); 全国标准信息公共服务平台 std.samr.gov.cn 标准状态页'
  checked: '2026-10-08'
  confidence: 0.75
  note: '散热方式决定用哪套温升限值(强制风冷 vs 自然冷却), 判据在 GB 4943.1 温升条款。这是判定口径的归属, 不是「强制风冷」这个词的定义出处。'
- id: COND_COOLING_NATURAL
  standard_ref: GB 4943.1-2022
  source: 'GB 4943.1 信息技术设备的安全 第1部分 通用要求 温升试验(自然冷却条件下测温升); 全国标准信息公共服务平台 std.samr.gov.cn 标准状态页'
  checked: '2026-10-08'
  confidence: 0.75
  note: '同 COND_COOLING_FORCED —— 散热方式归属 GB 4943.1 温升条款。'
- id: EFFICIENCY
  standard_ref: YD/T 4523-2023
  source: 'YD/T 4523-2023 通信电源术语和定义(通信行业标准, 效率属通信电源基础术语); 全国标准信息公共服务平台 行业标准备案页'
  checked: '2026-10-08'
  confidence: 0.75
  note: '「整机效率」的判定口径(额定点效率 + 测法)归 YD/T 4523《通信电源术语和定义》; 具体限值随型号与工况, 由规格书与 YD/T 983 等产品标准给出。未逐条核对条款号。'


