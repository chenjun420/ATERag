  note: '**标题原本是错的**: 种子里写「温热」, 而 JESD22-A108 的正式名称是 Temperature, Bias, and Operating Life。**特别注意别与温度循环混淆** —— 温度循环是 **JESD22-A104**(TC, -55°C~Tjmax); A108 是温度+偏置下的工作寿命/老化试验, 厂商产品资格报告里的 HTOL / LTOL / ELFR 用例正是它。id 用的是种子里已有的 `std::JEDEC JESD22-A108`(带 JEDEC 前缀); authority_kind 同样显式给(原因同 IPC-2221)。 [authority_kind 只能是 industry: knowledge_gate.check_authority_shape 要求 authority_ref 匹配 STANDARD_NUMBER(国标编号形态), 外国标准号过不了; 而这两个标准号根本没有实体端, 所以它们本来就不会建 defined_by 边 —— 改档不影响图结构]'
