# ---- 从 dead 的 standards 段迁过来: MTBF 改的是符号的中文名 ----
- id: sym::MTBF
  authority_kind: standard
  authority_ref: GB/T 3187-1994
  zh: '平均失效前时间'
  source: 'GB/T 3187-1994 7.2.8; 参照 GB/T 2900.99-2016《电工术语 第99部分》(IEC 60050-192:2015)'
  checked: '2026-10-08'
  confidence: 0.9
  note: '平均失效间隔时间在通用说明里含义并不统一: 译「平均/额定/定时间隔」。未找到 GB/T 2900.99-2016 的对应词条(该标准未收录本术语), 规范术语见 18.10 与注 8 禁止术语表。**这条原先被放在 standards 段** —— 但 sym::MTBF 是**符号**不是标准, 放错段的后果是每次构建都报「目标不存在」被静默跳过, 而 sym::MTBF 其实一直存在。'

