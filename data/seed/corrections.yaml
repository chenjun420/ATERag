  note: '**看起来像死条目, 其实不是**: 本条的 `current:` 分支是**唯一创建 `std::GB/T 2900.19-2022` 的地方** —— 那个 2022 实体不在方案 md 的标准表里, 只能靠这里建出来。删掉本条的后果实测过: 2022 实体消失, 而 INSULATION_VOLTAGE(authority_ref=GB/T 2900.19-2022 3.3.20 耐压)与 COND_ALTITUDE(3.1.21.4) 的引用随之悬空, 门禁报 ERROR。所以构建日志里那条「standard:GB/T 2900.19-1994(目标不存在)」是**预期的**: 1994 版本身没有实体(已被 2022 版取代), 但它的 current: 分支是活的。'
