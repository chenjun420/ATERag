# status=draft 仍生效但置信度 proposed 且 CI --check 会红; approved 为已签字。
# 评审: scripts/review_annotation.py -m <model> --show <REQ_ID>
version: 1
model_id: PA601-D54A
entries:
  SR-PA601-D54A-1213:
    status: approved
    fingerprint: 08edce5df4009d4f
    proposed_by: 装配器初稿 (需人工评审)
    approved_by: Harry.Chan
    approved_at: '2026-10-09'
    reason: 温度+输入+负载+时限四层复合条件, 正则无法完整切分
    input:
    - kind: temperature
      text: 温度≥-25℃:额定(标称)输入, 额定输出(电压和电流)
      value:
        op: '>='
        value: -25
        unit: ℃
    - kind: load
      text: 额定输出(电压和电流)
      value:
        value: 额定负载
    - kind: temperature
      text: 温度≤-25℃:低温下限启动, 输出半载
      value:
        op: <=
        value: -25
        unit: ℃
    - kind: load
      text: 输出半载
      value:
        value: 50
        unit: '% 额定'
    - kind: power_event
      text: 输入上电
      value:
        value: 上电
    output:
    - kind: timing
      text: '常温(≥-25℃): 各路输出上升到90%的时间, 开机输出延时≤6s'
      value:
        max: 6
        unit: s
    - kind: timing
      text: '低温(≤-25℃)下限启动: 开机输出延时≤12s, 启动过程中允许跌落'
      value:
        max: 12
        unit: s
