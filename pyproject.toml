[project]
name = "aterag"
version = "0.1.0"
description = "产测智能体系统 - 规格书驱动 RAG 服务 (MCP)"
# 开发机 3.13 / 板卡 (Debian 12 aarch64) 3.11 均可用; 依赖全部支持 >=3.10
requires-python = ">=3.11,<3.14"
dependencies = [
    # Apache AGE 图存储适配。只用到两个符号:
    #   semantica.kg.KnowledgeGraph          —— 规则图的 entities/relationships 容器
    #   semantica.graph_store.ApacheAgeStore  —— over AGE 的 Cypher 执行器
    # 代价是 22 个硬依赖(numpy/pandas/scipy/scikit-learn/pillow/grpcio/pyarrow/
    # rdflib/networkx/protobuf/...)。图是真的: power_rules 有 384 顶点/468 边,
    # 分产品 chunk-entity 图 138/833/9/30 顶点, 运行时由 checks.py 查询, 所以
    # 这个依赖是承重的, 不按「22 个包换 2 个符号」的账本直接删—— KnowledgeGraph
    # 是薄数据结构, ApacheAgeStore 是薄 Cypher 包装, 两者都可以用 psycopg2 直连
    # AGE 重写, 但那是对知识层动的手术, 该单独立项而不是顺手删依赖。
    # 保留裸 semantica 而非 semantica[graph-apache-age]: ApacheAgeStore 需要的
    # psycopg2 由本文件直接声明(见下), 避免把整棵图后端 extra 树拉进来。
    "semantica>=0.7",
    # SHACL 约束验证 (inference/engine.py, scripts/rules_selftest.py)
    "pyshacl>=0.30",
    # MCP 服务 (FastMCP, streamable-http)
    "mcp>=1.10",
    # 存储
    "psycopg[binary,pool]>=3.2",
    # psycopg2 是 semantica.ApacheAgeStore 的硬依赖(它内部 psycopg2.connect),
    # scripts/sync_semantica.py 也直接 import 它。semantica 的元数据把它挂在
    # [graph-apache-age] extra 下, 而这里不装那个 extra, 所以必须自己声明。
    # 之前它只在 venv 里(不在 pyproject 也不在 uv.lock), `uv sync --frozen`
    # 会直接把它卸掉——而这个脚本是维护那张真实规则图的唯一入口。
    "psycopg2-binary>=2.9",
    # asyncpg / pgvector: 本仓库代码不 import, 但 pgvector 的注册钩子
    # (`from pgvector.asyncpg import register_vector`) 需要 asyncpg 运行时,
    # 而 hybrid.py 用 pgvector 的 SQL 运算符(<=>)与 to_regclass 探测维度,
    # 不装 pgvector 时 ensure_vector_schema 会直接失败。
    # 审计时按「无 import」判为未使用是错的, 记录在此以免下次再犯。
    "asyncpg>=0.30",
    "pgvector>=0.5.0",
    # qdrant-client 已随 ADR-014 移除(检索层由 pgvector 承担, A-W3 验收完成)。
    # 模型适配 (OpenAI 兼容 / DashScope 原生)
    "httpx>=0.28",
    # 配置
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    # workbench/api.py 在模块级 import fastapi 与 uvicorn, 从未声明过。
    "fastapi>=0.110",
    "uvicorn>=0.27",
    # scripts/board_ssh.py 板卡运维脚本用 paramiko
    "paramiko>=3.4",
    # ingest/pipeline.py 模块级 import numpy (semantica 会传递带入,
    # 但直接 import 就该直接声明)
    "numpy>=1.26",
    # ---- W0 存储底座新增 ----
    # 物理量计算: pint 注册表管单位与量纲(ADR-015), 提供 7 维量纲向量的推导源。
    # 方案原则二要求「数值/单位/区间/可行性判定全部出 LLM 之外」, 单位判定
    # 没有 pint 就只能靠 LLM 猜, 等于把门禁交给被门禁的对象。
    # 冷却启动 100~300ms, 故 solver/symbolic.py 内做惰性单例。
    "pint>=0.24",
    # 符号化: expression -> expr_ast (psql DDL 的 formula.expr_ast 列,
    # §18.3.1 要求「等价归一用」)、符号恒等判重、公式求导。
    # 与 pint 分工: pint 管单位语义, sympy 管符号结构。A-11 的 7 维向量本质
    # 就是量纲指数向量, 两者互补不可互替 (ADR-015 备选表)。
    "sympy>=1.13",
    # 约束求解: A-W4 的仪器选型 CSP (solver/csp.py) 与 RCPSP 调度
    # (solver/rcpsp.py, CP-SAT)。
    # 参照: ATEStudio 侧 scheduler/cpsat.py 已经 try/except ImportError 地用了
    # ortools 但根本没在 pyproject 里声明, 导致 CP-SAT 路径静默降级为 None。
    # 同一个错不在两个仓库各犯一次。
    "ortools>=9.11",
    # 迁移: 方案 §18.1.3 要求 alembic/versions/。现状是全仓 CREATE TABLE IF
    # NOT EXISTS 散在 deploy/native/*.sh 与 ingest/pipeline.py:42-87, 没有任何
    # 版本记录, 也没有 down 路径。ALTER 只能靠人手改库。
    # 组织方式参照 ATEStudio 的 alembic.ini + alembic/env.py + versions/。
    "alembic>=1.14",
    # 已移除: markdown-it-py —— 全仓 0 import、0 引用。
    # 已移除: bm25s —— BM25 实际由 PostgreSQL 的 pg_textsearch + zhparser 提供
    #   (pipeline.py: to_bm25query('idx_aterag_chunks_bm25'))。bm25s 是设计文档里
    #   写过的「降级路径」, 从未实现。设计文档 1446 行的降级说明仍需更正。
]

[project.scripts]
# 收敛入口。现状是 scripts/ 下 71 个裸脚本、pyproject 零 [project.scripts],
# 没有任何 `aterag <cmd>` 可用, 部署方只能记文件路径。
# 这里只登记 W0 已经交付的; 其余随对应 Wave 补齐, 不预先声明不存在的命令。
aterag-db = "aterag.storage.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    # 覆盖率门禁。直接采用 ATEStudio 的标准 (fail_under=80, branch=True,
    # omit migrations/__init__), 不为 ATERag 另立一套。
    # 理由见 ADR-017: 测试标准应跨两个仓库统一, 否则同一缺陷在两个仓库的
    # 严重度评估会给出相反结论。
    "pytest-cov>=5.0",
    # 类型门禁。与 ruff 分工: ruff 抓风格与明显错误, mypy 抓跨层契约
    # (storage 契约的实现必须与 §18.2 的 dataclass 一致 —— 这类不一致
    # 正是方案 §18.10 注 5 点名的失败模式)。
    "mypy>=1.11",
    "types-pyyaml",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 八层结构仍在单一发行包 aterag 之下 (ADR-016: 对 §18.1.3 的刻意偏离)。
# wheel packages 无需改动: src/aterag 仍是唯一被打包的目录, 新增的 8 个层
# 作为其子包自动纳入。
[tool.hatch.build.targets.wheel]
packages = ["src/aterag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 方案 §18.1.3 的四层测试目录。但 testpaths 保留 tests/ 顶层 —— 因为旧的
# test_extract.py / test_local.py / test_mcp_review_tools.py 还平铺在那里,
# 它们测的是待退役的 src/aterag/{extract,rag,inference}, 退役后迁入 unit/。
# 写成 tests/unit 会让那 3 个文件在收集阶段被静默跳过 —— 门禁比它想守的
# 东西更重要, 所以宁可多写一个 testpaths。
testpaths = ["tests"]
# 门禁测试跑真实数据库与真实 seed, 与单元测试的隔离要求不同:
#   -m "not gate"  单测/CI 默认路径, 不需要 PG
#   -m "gate"      只跑 tests/gates/, 需要 POSTGRES_DSN
markers = [
    "gate: 质量门禁测试, 需要 POSTGRES_DSN 与完整 seed 数据",
    "integration: 需要外部服务 (PG / 嵌入服务 / LLM)",
    "slow: 需读 22,919 行方案全文, 数十秒级",
]
addopts = "-m 'not gate'"

[tool.mypy]
python_version = "3.11"
# 只对 W0 起的新八层开 strict。理由: 这八层是按 §18.2 接口契约新建的,
# 契约一致性必须由类型系统守; 而旧代码 (extract/ ingest/ inference/ rag/
# mcp_server/ workbench/ models/) 逐个 Wave 退役, 退役一个开一个,
# 全量打开会一次性引出数百条历史债, 属重构范畴, 不塞进本次提交。
# 退役进度由本文件的 exclude 列表体现 —— 列表变短就是进度, 反向指标。
files = ["src/aterag/storage",  "src/aterag/reasoning"]
strict = true
# 第三方库无类型标注。semantica / pyshacl / ortools 均属此类。
# 注意: 这会让这些库的调用失去类型检查, 是有意的取舍 —— 补 stubs 的收益
# 低于把它们隔离到 adapter 层(§18.2 的做法), 后者才是正解。
[[tool.mypy.overrides]]
module = [
    "semantica.*",
    "pyshacl.*",
    "ortools.*",
    "pgvector.*",
    "asyncpg.*",
    "mcp.*",
]
ignore_missing_imports = true
# 新八层里明确不 import 这些库的位置会被展开, 避免「全库 ignore」掩盖
# 真实的未使用依赖(旧教训: pyproject 曾因「本仓库 0 import」误判 asyncpg/pgvector 未使用)。
warn_unused_ignores = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# 显式钉住规则集, 不依赖 ruff 默认值 (默认规则随版本漂移, 会让 CI 行为不可复现)
[tool.ruff.lint]
# 只钉正确性相关规则: E(pycodestyle 错误) / F(pyflakes 逻辑错误) / I(import 排序)。
# 曾试过 SIM/PL/RET/B 等更宽集合, 会引出 280+ 条历史风格债, 属重构范畴而非本次提交;
# 如需推进应单独开分支分批治理, 不在此处把 CI 门禁做成大改。
select = ["E", "F", "I", "W"]
ignore = [
  "E501",  # 行长由 formatter 负责; 中文规格书摘录常超长, 强行折行反而难读
]
[tool.ruff.lint.per-file-ignores]
# 验证脚本: 允许 subprocess 不设 check (自行读 returncode 判定) 与裸 open (一次性读文件)
"scripts/*" = ["PLW1510", "SIM115", "ASYNC230", "S110", "E402"]
"tests/*" = ["S101", "PLR2004"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

